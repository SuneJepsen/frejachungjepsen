    "@context": "https://schema.org",

  <style>
    :root {
      --bg: oklch(0.98 0.008 75);
      --bg-alt: oklch(0.955 0.012 70);
      --ink: oklch(0.2 0.012 60);
      --ink-soft: oklch(0.45 0.01 60);
      --line: oklch(0.88 0.012 60);
      --accent: oklch(0.58 0.13 42);
      --accent-dark: oklch(0.48 0.13 42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Work Sans', sans-serif;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      color: var(--accent-dark);
    }

    ::selection {
      background: oklch(0.93 0.03 45);
    }

    /* NAV */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: oklch(0.98 0.008 75 / 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .nav .brand {
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 19px;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .nav .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--accent);
      color: oklch(0.98 0.01 70);
      border-radius: 3px;
      font-weight: 600;
      font-size: 14px;
      transition: background .2s;
    }

    .nav .back:hover {
      background: var(--accent-dark);
      color: oklch(0.98 0.01 70);
    }

    /* HEADER */
    .intro {
      max-width: 1280px;
      margin: 0 auto;
      padding: 90px 40px 48px;
      text-align: center;
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .intro h1 {
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.12;
      margin: 0 0 18px;
    }

    .intro p {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 19px;
      color: var(--ink-soft);
      margin: 0;
    }

    /* GRID (masonry, keeps natural aspect ratios) */
    .gallery {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 40px 100px;
      columns: 3;
      column-gap: 20px;
    }

    .item {
      display: block;
      width: 100%;
      margin: 0 0 20px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      cursor: zoom-in;
      background: var(--bg-alt);
      break-inside: avoid;
      transition: opacity .6s ease, transform .6s ease, box-shadow .3s ease;
    }

    .js .item {
      opacity: 0;
      transform: translateY(16px);
    }

    .js .item.in {
      opacity: 1;
      transform: none;
    }

    .item img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .6s cubic-bezier(.2, .7, .2, 1);
    }

    .item::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, oklch(0.16 0.01 50 / 0.35), transparent 45%);
      opacity: 0;
      transition: opacity .3s;
    }

    .item:hover {
      box-shadow: 0 14px 34px oklch(0.2 0.012 60 / 0.18);
    }

    .item:hover img {
      transform: scale(1.04);
    }

    .item:hover::after {
      opacity: 1;
    }

    .item:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    /* FOOTER */
    footer {
      background: oklch(0.16 0.01 50);
      padding: 56px 40px;
      text-align: center;
    }

    footer .name {
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 20px;
      color: oklch(0.98 0.01 70);
      margin-bottom: 10px;
    }

    footer .tag {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 15px;
      color: oklch(0.75 0.012 60);
    }

    /* LIGHTBOX */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: oklch(0.12 0.01 50 / 0.94);
      backdrop-filter: blur(6px);
      touch-action: pan-y;
    }

    .lb.open {
      display: flex;
      animation: fade .25s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }
    }

    .lb figure {
      margin: 0;
      max-width: 92vw;
      max-height: 88vh;
      display: flex;
    }

    .lb img {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 3px;
      box-shadow: 0 20px 60px oklch(0 0 0 / 0.5);
      user-select: none;
      -webkit-user-drag: none;
    }

    .lb button {
      position: absolute;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 1px solid oklch(1 0 0 / 0.2);
      border-radius: 50%;
      background: oklch(1 0 0 / 0.08);
      color: oklch(0.98 0.01 70);
      font-size: 22px;
      cursor: pointer;
      transition: background .2s;
    }

    .lb button:hover {
      background: oklch(1 0 0 / 0.2);
    }

    .lb .close {
      top: 20px;
      right: 20px;
    }

    .lb .prev {
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lb .next {
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lb .count {
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.1em;
      color: oklch(0.8 0.01 60);
    }

    body.locked {
      overflow: hidden;
    }

    /* RESPONSIVE */
    @media (max-width:1000px) {
      .gallery {
        columns: 2;
      }
    }

    @media (max-width:560px) {
      .nav {
        padding: 14px 20px;
      }

      .nav .brand {
        font-size: 16px;
      }

      .nav .back {
        padding: 8px 14px;
        font-size: 13px;
      }

      .intro {
        padding: 56px 20px 32px;
      }

      .gallery {
        padding: 0 20px 64px;
        column-gap: 12px;
      }

      .item {
        margin-bottom: 12px;
      }

      .lb .prev,
      .lb .next {
        top: auto;
        bottom: 16px;
        transform: none;
      }

      .lb .prev {
        left: 16px;
      }

      .lb .next {
        right: 16px;
      }

      .lb .close {
        top: 14px;
        right: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .item,
      .item img {
        transition: none;
      }

      .js .item {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a class="brand" href="index.html">Freja Chung Jepsen</a>
    <a class="back" href="index.html">&larr; Back to home</a>
  </nav>

  <header class="intro">
    <div class="eyebrow">Gallery</div>
    <h1>Moments from the tatami and beyond</h1>
    <p>Training, competition and everything in between.</p>
  </header>

  <main class="gallery" id="gallery" aria-label="Photo gallery">
    <button class="item" type="button" aria-label="Open photo 1 of 11"><img src="assets/gallery/5f5a3890-df5b-47ff-ae58-b55dce231af4.jpg" width="1920" height="1279" decoding="async" alt="Freja Chung Jepsen performing kata in a blue belt and Denmark karate gi on the mat at a WKF karate competition"></button>
    <button class="item" type="button" aria-label="Open photo 2 of 11"><img src="assets/gallery/4d1ddeb7-e848-41d2-abc9-738bad8d7b8f.jpg" width="1365" height="2048" decoding="async" alt="Freja Chung Jepsen balancing on one leg with a raised fist during a kata at the training hall, seen from behind"></button>
    <button class="item" type="button" aria-label="Open photo 3 of 11"><img src="assets/gallery/0266bce0-06da-4f43-aac6-7b0cf542d173.jpg" width="1170" height="1439" loading="lazy" decoding="async" alt="Freja Chung Jepsen performing kata in a large arena at an international karate championship"></button>
    <button class="item" type="button" aria-label="Open photo 4 of 11"><img src="assets/gallery/001ec9e9-fc82-41f0-abe5-3abbc3bced7f.jpg" width="1179" height="942" loading="lazy" decoding="async" alt="Freja Chung Jepsen in a deep kata stance with a red belt in front of the judges' table at a karate tournament"></button>
    <button class="item" type="button" aria-label="Open photo 5 of 11"><img src="assets/gallery/67da2f69-2354-43c0-9f4d-e32750a59fb6.jpg" width="1365" height="2048" loading="lazy" decoding="async" alt="Freja Chung Jepsen in a wide karate stance during training in front of the dojo mirrors"></button>
    <button class="item" type="button" aria-label="Open photo 6 of 11"><img src="assets/gallery/2977993c-3616-4eea-8c41-a79bed64ce90.jpg" width="1170" height="1765" loading="lazy" decoding="async" alt="Freja Chung Jepsen focused in a kata stance, wearing a red belt and the Danish crest, in front of the judges at a karate championship"></button>
    <button class="item" type="button" aria-label="Open photo 7 of 11"><img src="assets/gallery/9a24937d-f62b-4f56-b7e8-4407fb0e044d.jpg" width="1168" height="1402" loading="lazy" decoding="async" alt="Freja Chung Jepsen performing a high kick during kata on the competition mat in a large arena"></button>
    <button class="item" type="button" aria-label="Open photo 8 of 11"><img src="assets/gallery/7f66c367-e98e-4cf2-9ec4-d358bbaee65d.jpg" width="1365" height="2048" loading="lazy" decoding="async" alt="Freja Chung Jepsen in a blue belt performing kata with focused expression on the mat at an international karate competition"></button>
    <button class="item" type="button" aria-label="Open photo 9 of 11"><img src="assets/gallery/f14f168b-6ba4-4e47-9fe8-049296e33451.jpg" width="1170" height="1656" loading="lazy" decoding="async" alt="Close-up of Freja Chung Jepsen in a Denmark karate gi with a red belt, mid-kata in front of the judges"></button>
    <button class="item" type="button" aria-label="Open photo 10 of 11"><img src="assets/gallery/ba1e64b1-759d-4eda-bfca-9f6d908585d9.jpg" width="1365" height="2048" loading="lazy" decoding="async" alt="Freja Chung Jepsen balancing on one leg with a raised fist during kata at a WKF karate competition"></button>
    <button class="item" type="button" aria-label="Open photo 11 of 11"><img src="assets/gallery/baf0f264-947e-410e-8799-1202319a295f.jpg" width="1365" height="2048" loading="lazy" decoding="async" alt="Freja Chung Jepsen balancing on one leg in a blue belt during kata training in front of the dojo mirrors"></button>
  </main>

  <footer>
    <div class="name">Freja Chung Jepsen</div>
    <div class="tag">Dream big. Train hard. Never stop.</div>
  </footer>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="close" aria-label="Close">&times;</button>
    <button class="prev" aria-label="Previous image">&#8249;</button>
    <figure><img id="lb-img" alt=""></figure>
    <button class="next" aria-label="Next image">&#8250;</button>
    <div class="count" id="lb-count"></div>
  </div>

  <script>
    // The photos are plain <img> tags in the <main> above (so search engines can read them).
    // To add or remove a photo, add or remove a <button class="item"> there.
    const grid = document.getElementById("gallery");
    const items = [...grid.querySelectorAll(".item")];
    const images = items.map(b => b.querySelector("img").getAttribute("src"));
    const alts = items.map(b => b.querySelector("img").alt);
    const lb = document.getElementById("lb");
    const lbImg = document.getElementById("lb-img");
    const lbCount = document.getElementById("lb-count");
    let current = 0;
    let lastFocus = null;

    const io = "IntersectionObserver" in window
      ? new IntersectionObserver(entries => entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      }), { rootMargin: "0px 0px -40px 0px" })
      : null;

    items.forEach((b, i) => {
      b.addEventListener("click", () => open(i));
      io ? io.observe(b) : b.classList.add("in");
    });

    function show(i) {
      current = (i + images.length) % images.length;
      lbImg.src = images[current];
      lbImg.alt = alts[current];
      lbCount.textContent = (current + 1) + " / " + images.length;
      // preload neighbours
      [current + 1, current - 1].forEach(n => { new Image().src = images[(n + images.length) % images.length]; });
    }

    function open(i) {
      lastFocus = document.activeElement;
      show(i);
      lb.classList.add("open");
      document.body.classList.add("locked");
      lb.querySelector(".close").focus();
    }

    function close() {
      lb.classList.remove("open");
      document.body.classList.remove("locked");
      if (lastFocus) lastFocus.focus();
    }

    lb.querySelector(".close").addEventListener("click", close);
    lb.querySelector(".prev").addEventListener("click", () => show(current - 1));
    lb.querySelector(".next").addEventListener("click", () => show(current + 1));
    lb.addEventListener("click", e => { if (e.target === lb || e.target.tagName === "FIGURE") close(); });

    document.addEventListener("keydown", e => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowLeft") show(current - 1);
      else if (e.key === "ArrowRight") show(current + 1);
    });

    // swipe on touch devices
    let x0 = null;
    lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
      x0 = null;
    });
  </script>
